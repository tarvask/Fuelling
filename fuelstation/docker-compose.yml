services:
  kafka:
    image: confluentinc/cp-kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: EXTERNAL://0.0.0.0:9092,INTERNAL://0.0.0.0:9094,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9094
    volumes:
      - kafka_ui_data:/app/data
      
  postgres:
    image: postgres:16-alpine
    container_name: fuelstation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fuelstation
      POSTGRES_USER: fuelapp
      POSTGRES_PASSWORD: ai100
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U fuelapp -d fuelstation" ]
      interval: 5s
      timeout: 5s
      retries: 5
        
  redis:
    image: redis:7-alpine
    container_name: fuelstation-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
        
  reservation-service:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: ./FuelStation.ReservationService/Dockerfile
    container_name: fuelstation-reservation
    ports:
      - "5001:5001"   # gRPC
      #- "5000:5000"   # Healthcheck, no forwarding
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=fuelstation;Username=fuelapp;Password=ai100
      - Redis__ConnectionString=redis:6379
      - Kafka__BootstrapServers=kafka:9094
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
        
  payment-service:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: ./FuelStation.PaymentService/Dockerfile
    container_name: fuelstation-payment
    environment:
      - Kafka__BootstrapServers=kafka:9094
      - Grpc__GrpcAddress=http://reservation-service:5001
    depends_on:
      kafka:
        condition: service_started
      reservation-service:
        condition: service_started
        
  simulator:
    platform: linux/amd64
    build:
      context: ..
      dockerfile: ./FuelStation.Simulator/Dockerfile
    container_name: fuelstation-simulator
    environment:
      - Grpc__GrpcAddress=http://reservation-service:5001
    depends_on:
      reservation-service:
        condition: service_healthy

volumes:
  kafka_data:
  kafka_ui_data:
  postgres_data:
  redis_data:
    
networks:
  default:
    name: fuelstation-network