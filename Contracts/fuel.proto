syntax = "proto3";

package Fuel;

enum FuelType {
  UNKNOWN = 0;
  AI92 = 1;
  AI95 = 2;
  AI95F = 3;
  DT = 4;
  AI100 = 5;
}

service FuelReservation {
  rpc StartFuelling (StartFuellingRequest) returns (StartFuellingResponse);
  rpc CompleteFuelling  (CompleteFuellingRequest)  returns (CompleteFuellingResponse);
  rpc StartDelivery   (StartDeliveryRequest)   returns (StartDeliveryResponse);
  rpc GetStations (GetStationsRequest) returns (GetStationsResponse);
}

message StartFuellingRequest {
  string pump_id              = 1; // empty string means auto-selection by server
  FuelType fuel_type          = 2;
  double preauthorized_litres = 3;
  string station_id           = 4;
  string idempotency_key      = 5;
}

message StartFuellingResponse {
  bool   success         = 1;
  string session_id      = 2;
  double reserved_litres = 3;
  string error           = 4;
}

message CompleteFuellingRequest {
  string session_id    = 1;
  FuelType fuel_type   = 2;
  double actual_litres = 3;
  string station_id    = 4;
}

message CompleteFuellingResponse {
  bool   success = 1;
  string error   = 2;
}

message StartDeliveryRequest {
  repeated Compartment compartments = 1;
  string station_id                 = 2;
  string idempotency_key            = 3;
}

message StartDeliveryResponse {
  bool success = 1;
  string session_id = 2;
  string error = 3;
}

message Compartment {
  FuelType fuel_type = 1;
  double litres = 2;
}

message GetStationsRequest {
  // no parameters yet
}

message StationInfo {
  string id = 1;
  string name = 2;
  string address = 3;
}

message GetStationsResponse {
  repeated StationInfo stations = 1;
}